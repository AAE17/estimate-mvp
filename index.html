<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Estimate Generator</title>
</head>
<body>
  <h2>Estimate Form</h2>
  <form id="estimateForm">
    <label>Yojna: <input type="text" name="yojna"></label><br>
    <label>Kam: <input type="text" name="kam"></label><br>
    <label>Manjur Rakam: <input type="number" name="manjur"></label><br>
    <label>AAE: <input type="text" name="aae"></label><br>
    <label>SS: <input type="text" name="ss"></label><br>
    <label>Sr No: <input type="text" name="srno"></label><br>
    <label>Length: <input type="text" name="length" id="length"></label><br>
    <label>Width: <input type="text" name="width" id="width"></label><br>
    <label>Depth: <input type="text" name="depth" id="depth"></label><br>
    <label>Total: <input type="text" name="total" id="total"></label><br>
    <button type="submit">Generate Estimate</button>
  </form>

  <div id="result"></div>

  <script>
    const backendURL = "https://estimate-mvp.onrender.com"; // 🔗 Render backend URL

    // Auto-calc when Manjur Rakam change
    document.querySelector("input[name='manjur']").addEventListener("change", async function() {
      const manjur = this.value;
      const response = await fetch(`${backendURL}/auto-calc`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ manjur })
      });
      const result = await response.json();
      document.getElementById("length").value = result.length;
      document.getElementById("width").value = result.width;
      document.getElementById("depth").value = result.depth;
    });

    // Generate Estimate
    document.getElementById("estimateForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      const response = await fetch(`${backendURL}/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      document.getElementById("result").innerHTML =
        `Estimate ready: <a href="${backendURL}${result.url}" download>Download File</a>`;
    });
  </script>
</body>
</html>
