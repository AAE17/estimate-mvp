<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ParaState MVP</title>
  <style>
    :root { --g:#1B5D45; --s:#C45C26; --p:#F3EEE4; --i:#14211A; --l:#d7d0c4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Noto Sans Gujarati",system-ui,sans-serif; background:var(--p); color:var(--i); }
    header { background:var(--g); color:#fff; padding:14px 18px; }
    header b { display:block; font-size:18px; }
    header small { opacity:.85; }
    .wrap { max-width:820px; margin:0 auto; padding:20px 14px 50px; }
    .card { background:#fffdf8; border:1px solid var(--l); border-radius:14px; padding:22px; }
    h2 { margin:0 0 8px; }
    .muted { color:#5c6a63; margin:0 0 18px; line-height:1.45; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { margin-bottom:10px; }
    .field.full { grid-column:1/-1; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:4px; }
    input, textarea, select {
      width:100%; padding:10px 11px; border:1px solid var(--l); border-radius:8px; font:inherit;
    }
    .btn { border:0; border-radius:10px; padding:12px 16px; font:inherit; font-weight:700; cursor:pointer; }
    .btn-g { background:var(--g); color:#fff; }
    .btn-s { background:var(--s); color:#fff; }
    .btn-w { background:#fff; border:1px solid var(--l); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    .choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .choice button { text-align:left; padding:14px; border-radius:12px; border:2px solid var(--l); background:#fff; cursor:pointer; font:inherit; }
    .hidden { display: none !important; }
    .toast {
      position:fixed; inset:0; background:rgba(20,33,26,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;
    }
    .toast .box { background:#fff; border-radius:12px; padding:18px; max-width:360px; }
    @media (max-width:640px) { .grid,.choice { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <b>ParaState</b>
    <small>Scan · Estimate · Sanction · MVP</small>
  </header>
  <div class="wrap">

    <section id="s-hi" class="card">
      <h2>નમસ્તે, Ashok Suthar</h2>
      <p class="muted">તાલુકા પંચાયત થાસરા — એસ્ટિમેટ MVP. હાલમાં ફક્ત <b>CC Road</b> ચાલુ છે.</p>
      <button class="btn btn-g" onclick="goTypes()">Estimate Generate</button>
    </section>

    <section id="s-type" class="card hidden">
      <h2>એસ્ટિમેટ પ્રકાર</h2>
      <p class="muted">CC પસંદ કરો. બાકી ટૂંક સમયમાં.</p>
      <div class="choice">
        <button onclick="goForm()">CC Road</button>
        <button onclick="soon('Paver Block')">Paver Block</button>
        <button onclick="soon('Gutter line')">Gutter line</button>
        <button onclick="soon('Pipe Line')">Pipe Line</button>
      </div>
      <div class="actions"><button class="btn btn-w" onclick="show('s-hi')">પાછા</button></div>
    </section>

    <section id="s-form" class="card hidden">
      <h2>CC Road — ફોર્મ</h2>
      <p class="muted">વાદળી સેલ ભરાશે. બાકી સ્કેલેટન ફોર્મેટ જ રહેશે.</p>
      <div class="grid">
        <div class="field"><label>R & B Division</label><input id="division" value="NADIAD"></div>
        <div class="field"><label>જિલ્લા પંચાયત</label><input id="jilla" value="KHEDA"></div>
        <div class="field"><label>Sub-div એડ્રેસ</label><input id="subdiv_address" value="DAKOR"></div>
        <div class="field"><label>Nani Sinchai એડ્રેસ</label><input id="nani_address" value="DAKOR"></div>
        <div class="field"><label>તાલુકો</label><input id="taluka" value="Thasra"></div>
        <div class="field"><label>મોજે (ગામ)</label><input id="village" value="ગોળજ"></div>
        <div class="field full"><label>Fund Head</label><input id="fund_head" value="ધારા ફંડ વર્ષ ૨૦૨૫-૨૬."></div>
        <div class="field full"><label>કામનું નામ</label><input id="work_name" value="ગોળજ ગામે ઉનાળીયા ચેરમેનના ઘર થી ખૂટતા સી.સી. રસ્તાનું કામ ."></div>
        <div class="field"><label>Amounting to Rs.</label><input id="amounting" type="number" value="100000"></div>
        <div class="field"><label>Prepared by</label><input id="prepared_by" value="MR.V.A.THAKOR. A.A.E."></div>
        <div class="field"><label>Sr No</label><input id="sr_no" value="6"></div>
        <div class="field full"><label>SS વિગત</label><input id="ss_details" value="જઅમ/ધા.ફં/પ્રા.મં/૬(૧)/૨૫-૨૬/વશી/૨૧૭-૧૯/૨૫. તા. ૧૭/૦૭/૨૦૨૫."></div>
        <div class="field"><label>લંબાઈ (m)</label><input id="length_m" type="number" step="0.01" value="40"></div>
        <div class="field"><label>પહોળાઈ (m)</label><input id="width_m" type="number" step="0.01" value="3"></div>
        <div class="field"><label>Box જાડાઈ (m)</label><input id="box_thick_m" type="number" step="0.01" value="0.3"></div>
        <div class="field"><label>BT જાડાઈ (m)</label><input id="bt_thick_m" type="number" step="0.01" value="0.12"></div>
        <div class="field"><label>Voids (0.15 = 15%)</label><input id="voids" type="number" step="0.01" value="0.15"></div>
        <div class="field"><label>મુરમ %</label><input id="murrum_pct" type="number" step="0.01" value="25"></div>
        <div class="field"><label>CC જાડાઈ (m)</label><input id="cc_thick_m" type="number" step="0.01" value="0.1"></div>
        <div class="field"><label>Sevaliya → તાલુકો km</label><input id="lead_sevaliya_to_taluka_km" type="number" step="0.1" value="15"></div>
        <div class="field"><label>તાલુકો → સાઇટ km</label><input id="lead_taluka_to_site_km" type="number" step="0.1" value="15"></div>
      </div>
      <div class="actions">
        <button class="btn btn-w" onclick="show('s-type')">પાછા</button>
        <button class="btn btn-s" id="goBtn" onclick="submitForm()">Excel + PDF ડાઉનલોડ</button>
      </div>
      <p class="muted" id="msg"></p>
    </section>
  </div>

  <div id="pop" class="toast hidden" onclick="this.classList.add('hidden')">
    <div class="box" onclick="event.stopPropagation()">
      <b>Under construction</b>
      <p id="popText" class="muted"></p>
      <button class="btn btn-g" onclick="document.getElementById('pop').classList.add('hidden')">OK — CC પસંદ કરો</button>
    </div>
  </div>

<script>
  const API = "";

  function show(id) {
    ["s-hi","s-type","s-form"].forEach(s => document.getElementById(s).classList.toggle("hidden", s !== id));
  }
  function goTypes() {
    fetch(API + "/api/log", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({kind:"open_generate", user:"Ashok Suthar"}) });
    show("s-type");
  }
  function goForm() {
    fetch(API + "/api/log", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({kind:"select_cc"}) });
    show("s-form");
  }
  function soon(name) {
    fetch(API + "/api/log", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({kind:"blocked_type", type:name}) });
    document.getElementById("popText").textContent = name + " under construction. Select CC only.";
    document.getElementById("pop").classList.remove("hidden");
  }
  function val(id) { return document.getElementById(id).value; }
  function num(id) { return Number(document.getElementById(id).value); }

  async function submitForm() {
    const btn = document.getElementById("goBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    msg.textContent = "બની રહ્યું છે…";
    const body = {
      user_name: "Ashok Suthar",
      division: val("division"),
      jilla: val("jilla"),
      subdiv_address: val("subdiv_address"),
      nani_address: val("nani_address"),
      taluka: val("taluka"),
      fund_head: val("fund_head"),
      work_name: val("work_name"),
      amounting: num("amounting"),
      prepared_by: val("prepared_by"),
      sr_no: val("sr_no"),
      ss_details: val("ss_details"),
      village: val("village"),
      length_m: num("length_m"),
      width_m: num("width_m"),
      box_thick_m: num("box_thick_m"),
      bt_thick_m: num("bt_thick_m"),
      voids: num("voids"),
      murrum_pct: num("murrum_pct"),
      cc_thick_m: num("cc_thick_m"),
      lead_sevaliya_to_taluka_km: num("lead_sevaliya_to_taluka_km"),
      lead_taluka_to_site_km: num("lead_taluka_to_site_km")
    };
    try {
      const res = await fetch(API + "/api/estimate/cc", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "fail");
      if (data.xlsx) window.open(API + data.xlsx, "_blank");
      if (data.pdf) setTimeout(() => window.open(API + data.pdf, "_blank"), 400);
      msg.textContent = data.pdf ? "Excel અને PDF ડાઉનલોડ થયા." : "Excel થયું. PDF: " + (data.pdf_error || "નથી");
    } catch (e) {
      msg.textContent = "ભૂલ: " + e.message;
    }
    btn.disabled = false;
  }

  fetch(API + "/api/log", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({kind:"page_open", user:"Ashok Suthar"}) });
</script>
</body>
</html>
